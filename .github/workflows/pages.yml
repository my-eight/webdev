name: Сборка и публикация сайта

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    env:
      NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
      NUXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      NUXT_PUBLIC_INDEXABLE: 'false'
    steps:
      - name: Получение исходников
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Установка Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Установка pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile
      - name: Проверка TypeScript
        run: pnpm typecheck
      - name: Сборка статических страниц
        run: pnpm build:pages
      - name: Проверка HTML, ссылок и ресурсов
        run: pnpm check:static
      - name: Подготовка публикации
        uses: actions/configure-pages@v6.0.0
      - name: Загрузка сайта
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: frontend/.output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
